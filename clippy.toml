allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
max-fn-params-bools = 2
# Proper nouns beyond clippy's default list, so doc comments need not backtick them.
doc-valid-idents = ["SQLite", "WebSockets", ".."]
# Guards of thread-local state, which an `.await` must not hold: KJ may resume a future on another
# OS thread (see `src/rust/jsg/README.md`, safety rule 5). `await_holding_lock` covers the std lock
# guards.
await-holding-invalid-types = [
  { path = "tokio::runtime::EnterGuard", reason = "it enters the runtime on this OS thread only" },
  { path = "tracing::dispatcher::DefaultGuard", reason = "it sets this OS thread's subscriber" },
  { path = "tracing::span::Entered", reason = "it enters the span on this OS thread only" },
  { path = "tracing::span::EnteredSpan", reason = "it enters the span on this OS thread only" },
  { path = "tokio::task::LocalEnterGuard", reason = "it enters the LocalSet on this OS thread only" },
  { path = "rand::rngs::ThreadRng", reason = "it shares this OS thread's generator, without synchronization" },
]
# `thread_local!` declares each static as a `LocalKey`, so this makes each thread-local static
# outside tests need `#[expect(clippy::disallowed_types, reason = "...")]` (`disallowed-macros`
# cannot be expected below the crate root for it). Its value belongs to the OS thread, but an event
# loop may move between OS threads, and KJ may resume a future on another. Test code is exempt
# (`//build/rust:test_lints`).
disallowed-types = [
  { path = "std::thread::LocalKey", reason = "an event loop, and the futures it polls, may move between OS threads; state of either must not be thread-local" },
]
