name: 'Setup runner environment'
description: 'Sets up runner environment with proper toolchain for building workerd'
inputs:
  GOOGLESOURCE_COOKIE:
    description: 'Cookie for googlesource.com'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup Windows
      shell: pwsh
      env:
        GOOGLESOURCE_COOKIE: ${{ inputs.GOOGLESOURCE_COOKIE }}
      if: runner.os == 'Windows'
      # Set a custom output root directory to avoid long file name issues.
      # TODO(cleanup): According to https://github.com/actions/runner-images/blob/win25/20251216.149/images/windows/scripts/build/Configure-DeveloperMode.ps1#L13,
      # this should already be set on the build image, but prior testing indicated CI speedups with
      # it, check if it is actually having any effect.
      run: |
        # Enable Developer Mode to allow Bazel to create real symlinks
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        git config --global core.symlinks true
        git config --show-scope --show-origin core.symlinks
        git config --system core.longpaths true
        [System.IO.File]::WriteAllLines((Join-Path -Path $env:USERPROFILE -ChildPath '.bazelrc'), 'startup --output_user_root=\\\\?\\C:\\tmp')
        # Use LLVM 22 to work around https://github.com/actions/runner-images/issues/15367 - the
        # runner defaults to LLVM 20 which is incompatible with latest MSVC.
        # choco exits 0 when its feed is unreachable, so check the installed version, and install
        # from the LLVM GitHub release when the feed is down.
        $llvmVersion = '22.1.8'
        $llvmInstallerSha256 = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
        $clangCl = 'C:\Program Files\LLVM\bin\clang-cl.exe'
        function Test-Llvm {
          (& $clangCl --version | Out-String) -match "clang version $([regex]::Escape($llvmVersion))"
        }
        choco upgrade llvm --version=$llvmVersion -y --no-progress
        if (-not (Test-Llvm)) {
          Write-Output "choco did not install LLVM $llvmVersion, installing it from the LLVM GitHub release"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.exe" `
            -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $llvmInstallerSha256) {
            Write-Error "LLVM-$llvmVersion-win64.exe does not match its SHA-256"
            exit 1
          }
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
        }
        if (-not (Test-Llvm)) {
          Write-Error "Failed to install LLVM $llvmVersion; refusing to build with $(& $clangCl --version | Select-Object -First 1)"
          exit 1
        }
    - name: Configure git hooks
      shell: bash
      # Configure git to quell an irrelevant warning for runners (they never commit / push).
      run: git config core.hooksPath githooks
    # Skip when the cookie is empty (forks, Dependabot PRs, local runs). Bazel will
    # fall back to the unauthenticated googlesource endpoint, which is slower / more
    # rate-limited but works without credentials.
    - name: Configure Googlesource credentials (Unix)
      shell: bash
      if: inputs.GOOGLESOURCE_COOKIE != '' && runner.os != 'Windows'
      env:
        GOOGLESOURCE_COOKIE: ${{ inputs.GOOGLESOURCE_COOKIE }}
      run: |
        git config --global --add url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"
        git config --global http.cookiefile ~/.gitcookies
        tr , \\t <<__END__ >>~/.gitcookies
        .googlesource.com,TRUE,/,TRUE,2147483647,o,$GOOGLESOURCE_COOKIE
        __END__
    - name: Configure Googlesource credentials (Windows)
      shell: pwsh
      if: inputs.GOOGLESOURCE_COOKIE != '' && runner.os == 'Windows'
      env:
        GOOGLESOURCE_COOKIE: ${{ inputs.GOOGLESOURCE_COOKIE }}
      run: |
        git config --global --add url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"
        git config --global http.cookiefile "$env:USERPROFILE\.gitcookies"
        Write-Output ".googlesource.com`tTRUE`t/`tTRUE`t2147483647`to`t$env:GOOGLESOURCE_COOKIE" >> "$env:USERPROFILE\.gitcookies"
