name: Run internal build

on:
  pull_request_target:

# Read-only permissions are enough
permissions: read-all

concurrency:
  # Cancel existing builds for the same PR.
  # Otherwise, all other builds will be allowed to run through.
  group: internal-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # This is a required check, so the job always runs and succeeds without
  # building when the PR doesn't touch anything the parent project consumes.
  # Keeping the path filter in the same job means a filter failure fails the
  # check instead of skipping it.
  internal-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for internal build changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          paths="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          # The internal build compiles the parent project against this PR, so
          # it only needs to run for paths the parent project consumes. The
          # first matching pattern wins, so exceptions come before the broader
          # patterns they carve out of. Unlisted paths (docs/, .github/,
          # samples/, types/, justfile, ...) are used only by this repository.
          internal_build=false
          while IFS= read -r path; do
            case "$path" in
              # Documentation, including READMEs and AGENTS.md files under src/.
              *.md)
                ;;
              # The parent project doesn't link workerd's server, but its
              # .bazelrc sets //src/workerd/server:use_tcmalloc, and BUILD files
              # elsewhere under src/ load .bzl files from here.
              src/workerd/server/BUILD.bazel|src/workerd/server/*.bzl)
                internal_build=true
                break
                ;;
              src/workerd/server/*)
                ;;
              # Tooling used only by this repository. internal_build.py always
              # runs from the base branch, so the internal build can't exercise
              # PR changes to it.
              tools/cross/internal_build.py|tools/intellij/*|tools/unix/*|\
              tools/windows/*|tools/update_node_version.py|\
              tools/custom-eslint-rules.test.mjs)
                ;;
              # The parent project symlinks src/ and parts of build/, reuses
              # patches/ and deps/, runs tools/clang-tidy and tools/cross/format.py,
              # and builds the pnpm workspace defined here.
              src/*|build/*|deps/*|patches/*|tools/*|\
              BUILD.bazel|.bazelignore|\
              .npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|\
              images/container-client-test/package.json)
                internal_build=true
                break
                ;;
            esac
          done <<< "$paths"

          echo "internal_build=$internal_build" >> "$GITHUB_OUTPUT"

      - name: Skip internal build
        if: steps.filter.outputs.internal_build != 'true'
        run: |
          echo "This PR doesn't change anything the internal build depends on; passing without building."

      # Check if this is a fork and if the owner is a Cloudflare org member
      - name: Check fork status and org membership
        if: steps.filter.outputs.internal_build == 'true' && github.event.pull_request.head.repo.fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "Fork detected. Checking if $FORK_OWNER is a Cloudflare org member..."

          if gh api "orgs/cloudflare/members/$FORK_OWNER" --silent 2>/dev/null; then
            echo "✓ Cloudflare org member confirmed"
          else
            echo "✗ Fork owner '$FORK_OWNER' is not a public Cloudflare org member."
            echo ""
            echo "GitHub's public membership API cannot verify private organization membership."
            echo "If you are a Cloudflare org member, open the page below, find your account,"
            echo "change your organization visibility from Private to Public, and re-run this workflow:"
            echo "https://github.com/orgs/cloudflare/people"
            echo ""
            echo "If you are an external contributor, please ask the auto-assigned reviewers for help."
            exit 1
          fi

      - name: Checkout trusted workflow tooling
        if: steps.filter.outputs.internal_build == 'true'
        uses: actions/checkout@v7
        with:
          path: trusted
          persist-credentials: false
          show-progress: false

      # Try to checkout the merge commit - will fail if PR isn't mergeable
      - uses: actions/checkout@v7
        id: checkout_merge
        if: steps.filter.outputs.internal_build == 'true'
        continue-on-error: true
        with:
          # Fork PRs reach this step only after their owner is confirmed to be a
          # public Cloudflare org member. Workflow tooling runs from the trusted checkout.
          allow-unsafe-pr-checkout: true
          path: pull-request
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          show-progress: false

      # Fail the workflow if checkout failed (PR isn't mergeable)
      - name: Fail if PR isn't mergeable
        if: steps.filter.outputs.internal_build == 'true' && steps.checkout_merge.outcome != 'success'
        run: |
          echo "The pull request is not mergeable. Please rebase and resolve any conflicts."
          exit 1

      - name: Run internal build
        if: steps.filter.outputs.internal_build == 'true'
        working-directory: trusted
        env:
          CI_URL: ${{ secrets.CI_URL }}
          CI_CLIENT_ID: ${{ secrets.CI_CF_ACCESS_CLIENT_ID }}
          CI_CLIENT_SECRET: ${{ secrets.CI_CF_ACCESS_CLIENT_SECRET }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          # Format ref based on whether this is a fork
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            REF="$FORK_OWNER/$HEAD_REF"
          else
            REF="$HEAD_REF"
          fi

          python3 -u ./tools/cross/internal_build.py \
            ${{github.event.pull_request.number}} \
            ${{steps.checkout_merge.outputs.commit}} \
            ${{github.event.pull_request.head.sha}} \
            ${{github.run_attempt}} \
            "$REF" \
            $CI_URL \
            $CI_CLIENT_ID \
            $CI_CLIENT_SECRET
