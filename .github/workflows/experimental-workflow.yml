name: Blob cage focused verification
on:
  workflow_dispatch:

# CI-only branch: the parent commit is the PR head. Do not merge this workflow change.
permissions:
  contents: read
  actions: write

jobs:
  focused-asan:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      suffix: -asan-focused
      extra_bazel_args: '--config=ci-test --config=ci-linux-asan --runs_per_test=5 --flaky_test_attempts=1'
      build_target: >-
        //src/workerd/api:blob-test@
        //src/workerd/api:blob-test@all-autogates
        //src/workerd/api:js-readable-stream-test@
        //src/workerd/api:js-readable-stream-test@all-autogates
        //src/workerd/api/tests:blob-test@
        //src/workerd/api/tests:blob-test@all-compat-flags
        //src/workerd/api/tests:blob-test@all-autogates
        //src/workerd/api/tests:form-data-test@
        //src/workerd/api/tests:form-data-test@all-compat-flags
        //src/workerd/api/tests:form-data-test@all-autogates
        //src/workerd/api/tests:r2-test@
        //src/workerd/api/tests:r2-test@all-compat-flags
        //src/workerd/api/tests:r2-test@all-autogates
        //src/workerd/api/tests:connect-neuter-test@
        //src/workerd/api/tests:connect-neuter-test@all-compat-flags
        //src/workerd/api/tests:connect-neuter-test@all-autogates
        //src/workerd/server/tests:server-harness-test
        //src/workerd/server/tests/udp-connect:udp-connect-test
      test_target: >-
        //src/workerd/api:blob-test@
        //src/workerd/api:blob-test@all-autogates
        //src/workerd/api:js-readable-stream-test@
        //src/workerd/api:js-readable-stream-test@all-autogates
        //src/workerd/api/tests:blob-test@
        //src/workerd/api/tests:blob-test@all-compat-flags
        //src/workerd/api/tests:blob-test@all-autogates
        //src/workerd/api/tests:form-data-test@
        //src/workerd/api/tests:form-data-test@all-compat-flags
        //src/workerd/api/tests:form-data-test@all-autogates
        //src/workerd/api/tests:r2-test@
        //src/workerd/api/tests:r2-test@all-compat-flags
        //src/workerd/api/tests:r2-test@all-autogates
        //src/workerd/api/tests:connect-neuter-test@
        //src/workerd/api/tests:connect-neuter-test@all-compat-flags
        //src/workerd/api/tests:connect-neuter-test@all-autogates
        //src/workerd/server/tests:server-harness-test
        //src/workerd/server/tests/udp-connect:udp-connect-test
      upload_test_logs: true
    secrets: inherit

  focused-coverage:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      suffix: -coverage-focused
      extra_bazel_args: '--config=ci-linux-common --config=ci-limit-storage --config=coverage --test_env=CI=true --config=wpt-test --runs_per_test=5 --flaky_test_attempts=1'
      build_target: >-
        //src/workerd/server/tests:server-harness-test
        //src/workerd/server/tests/udp-connect:udp-connect-test
      test_target: >-
        //src/workerd/server/tests:server-harness-test
        //src/workerd/server/tests/udp-connect:udp-connect-test
      run_coverage: true
      upload_test_logs: true
    secrets: inherit
