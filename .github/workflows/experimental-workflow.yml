name: Persistent stubs Windows timing investigation
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Confined to this diagnostic branch; measure completion with a storage-suite budget.
jobs:
  audit:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: windows-2025-16core
      os_name: windows
      arch_name: X64
      phase: -persistent-timing
      build_target: //src/workerd/api/tests:persistent-stubs-test@
      test_target: >-
        //src/workerd/api/tests:persistent-stubs-test@
        //src/workerd/api/tests:persistent-stubs-test@all-autogates
        //src/workerd/api/tests:persistent-stubs-test@all-compat-flags
      extra_bazel_args: >-
        --config=ci-test --config=ci-windows
        --runs_per_test=5 --flaky_test_attempts=1
      upload_test_logs: true
    secrets: inherit
