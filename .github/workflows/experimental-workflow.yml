name: UTF-8 ESM cache regression audit
on:
  workflow_dispatch:
    inputs:
      debug_only:
        description: Run only the loader backtrace diagnostic
        type: boolean
        default: false

# This workflow is confined to the diagnostic branch.
permissions:
  contents: read
  actions: write

jobs:
  positive:
    if: ${{ !inputs.debug_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-22.04-16core
            os: linux
          - image: windows-2025-16core
            os: windows
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ${{ matrix.image }}
      os_name: ${{ matrix.os }}
      arch_name: X64
      build_target: //src/workerd/jsg:compile-cache-test@
      test_target: >-
        //src/workerd/jsg:compile-cache-test@
        //src/workerd/jsg:compile-cache-test@all-autogates
      extra_bazel_args: >-
        --config=ci-test --config=ci-${{ matrix.os }}
        --runs_per_test=5 --flaky_test_attempts=1
      upload_test_logs: true
    secrets: inherit
  negative:
    if: ${{ !inputs.debug_only }}
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      phase: '-negative-utf8'
      build_target: //src/workerd/jsg:compile-cache-test_binary
      run_tests: false
      extra_bazel_args: '--config=ci-test --config=ci-linux'
    secrets: inherit
  negative-loader:
    if: ${{ !inputs.debug_only }}
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      phase: '-negative-loader'
      build_target: //src/workerd/jsg:compile-cache-test_binary
      run_tests: false
      extra_bazel_args: '--config=ci-test --config=ci-linux'
    secrets: inherit
  debug-loader:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      phase: '-debug-loader'
      build_target: //src/workerd/jsg:compile-cache-test_binary
      run_tests: false
      extra_bazel_args: '--config=ci-test --config=ci-linux --remote_download_toplevel'
    secrets: inherit
