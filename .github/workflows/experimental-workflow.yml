name: Tracing allocation regression audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ''
            extra: ''
          - suffix: '-debug'
            extra: '--config=debug'
          - suffix: '-asan'
            extra: '--config=asan'
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      suffix: ${{ matrix.suffix }}
      build_target: //src/workerd/jsg:tracing-test@
      test_target: >-
        //src/workerd/jsg:tracing-test@
        //src/workerd/jsg:tracing-test@all-autogates
      extra_bazel_args: >-
        --config=ci-test --config=ci-linux ${{ matrix.extra }}
        --runs_per_test=5 --flaky_test_attempts=1
      upload_test_logs: true
    secrets: inherit
