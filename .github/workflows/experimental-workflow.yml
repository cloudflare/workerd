name: Blob SDK TCP fixture fix verification
on:
  workflow_dispatch:

# CI-only diagnostic workflow; do not merge into the Blob PR.
permissions:
  contents: read
  actions: read

jobs:
  sdk-ports:
    runs-on: ubuntu-22.04-16core
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostics
      - uses: actions/checkout@v7
        with:
          repository: cloudflare/workers-sdk
          ref: 9f87de8cd6e8ff5afedb5430acd8776cb239844e
          path: sdk
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
          package_json_file: sdk/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: linux-X64-binary
          path: /tmp
          run-id: 38265224189
          github-token: ${{ github.token }}
      - run: chmod +x /tmp/workerd
      - run: pnpm install --frozen-lockfile
        working-directory: sdk
      - name: Apply and format proposed SDK fixture fix
        run: |
          git apply ../diagnostics/.github/scripts/blob-sdk-tcp-fix.patch
          pnpm exec oxfmt packages/miniflare/src/index.ts packages/miniflare/src/shared/connect.ts packages/miniflare/test/index.spec.ts packages/miniflare/test/connect.spec.ts
          git add packages/miniflare/src/index.ts packages/miniflare/src/shared/connect.ts packages/miniflare/test/index.spec.ts packages/miniflare/test/connect.spec.ts
          git diff --cached > ../sdk-tcp-fixture-fix.patch
        working-directory: sdk
      - name: Run complete Miniflare suite without retries
        run: pnpm test:ci --filter miniflare -- --retry=0 --reporter=default --reporter=json --outputFile=../../miniflare-fix-suite.json
        working-directory: sdk
        env:
          MINIFLARE_WORKERD_PATH: /tmp/workerd
      - name: Lint proposed SDK changes
        run: pnpm exec oxlint --deny-warnings --type-aware packages/miniflare/src/index.ts packages/miniflare/src/shared/connect.ts packages/miniflare/test/index.spec.ts packages/miniflare/test/connect.spec.ts
        working-directory: sdk
      - name: Prepare fifty fixed fixture runs
        run: python3 diagnostics/.github/scripts/blob-sdk-tcp-fix-verification.py
      - name: Repeat fixed fixture and selection tests without retries
        run: pnpm test:ci --filter miniflare -- test/tcp-port-fix-repeated.spec.ts test/connect-fix-repeated.spec.ts --retry=0 --reporter=default --reporter=json --outputFile=../../tcp-port-fix-repeated.json
        working-directory: sdk
        env:
          MINIFLARE_WORKERD_PATH: /tmp/workerd
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-tcp-fixture-fix
          path: |
            sdk-tcp-fixture-fix.patch
            sdk/miniflare-fix-suite.json
            sdk/tcp-port-fix-repeated.json
            sdk/packages/miniflare/test/tcp-port-fix-repeated.spec.ts
            sdk/packages/miniflare/test/connect-fix-repeated.spec.ts
