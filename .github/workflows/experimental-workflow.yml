name: Strict GC fixture validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os:
          - {name: linux, arch: X64, image: ubuntu-22.04-16core}
          - {name: macOS, arch: ARM64, image: macos-15-xlarge, use_lld: true}
          - {name: windows, arch: X64, image: windows-2025-16core}
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ${{ matrix.os.image }}
      os_name: ${{ matrix.os.name }}
      arch_name: ${{ matrix.os.arch }}
      macos_use_lld: ${{ matrix.os.use_lld || false }}
      build_target: '//src/workerd/api/node/tests:gc-tracing-nodejs-test@ //src/workerd/api/node/tests:gc-tracing-nodejs-test@all-autogates //src/workerd/api/node/tests:gc-tracing-nodejs-test@all-compat-flags'
      test_target: '//src/workerd/api/node/tests:gc-tracing-nodejs-test@ //src/workerd/api/node/tests:gc-tracing-nodejs-test@all-autogates //src/workerd/api/node/tests:gc-tracing-nodejs-test@all-compat-flags'
      extra_bazel_args: '--config=ci-test --config=ci-${{matrix.os.name}} --runs_per_test=5 --flaky_test_attempts=1'
      upload_test_logs: true
    secrets:
      BAZEL_CACHE_KEY: ${{ secrets.BAZEL_CACHE_KEY }}
      WORKERS_MIRROR_URL: ${{ secrets.WORKERS_MIRROR_URL }}
      GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
