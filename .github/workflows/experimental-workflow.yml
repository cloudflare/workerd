name: Code cache Windows case verification
on:
  workflow_dispatch:

# CI-only branch; production code matches the PR head.
permissions:
  contents: read
  actions: write

jobs:
  worker-cases-windows:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: windows-2025-16core
      os_name: windows
      arch_name: X64
      suffix: -cache-focused
      extra_bazel_args: '--config=ci-test --config=ci-windows --runs_per_test=5 --flaky_test_attempts=1 --test_output=all --test_arg=--filter=*worker-code-cache-test.c++:221-299'
      build_target: >-
        //src/workerd/io:worker-code-cache-test@
        //src/workerd/io:worker-code-cache-test@all-autogates
      test_target: >-
        //src/workerd/io:worker-code-cache-test@
        //src/workerd/io:worker-code-cache-test@all-autogates
      upload_test_logs: true
    secrets: inherit
