name: Python manager-owned Wasm regression audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  positive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-22.04-16core
            os: linux
            extra: ''
          - image: ubuntu-22.04-16core
            os: linux
            extra: '--config=asan'
          - image: windows-2025-16core
            os: windows
            extra: ''
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ${{ matrix.image }}
      os_name: ${{ matrix.os }}
      arch_name: X64
      suffix: ${{ matrix.extra == '--config=asan' && '-asan' || '' }}
      build_target: //src/workerd/api:pyodide/wasm-module-test@
      test_target: >-
        //src/workerd/api:pyodide/wasm-module-test@
        //src/workerd/api:pyodide/wasm-module-test@all-autogates
      extra_bazel_args: >-
        --config=ci-test --config=ci-${{ matrix.os }} ${{ matrix.extra }}
        --runs_per_test=5 --flaky_test_attempts=1
      upload_test_logs: true
    secrets: inherit
  negative:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: X64
      phase: '-negative-pyodide-holder'
      build_target: //src/workerd/api:pyodide/wasm-module-test_binary
      run_tests: false
      extra_bazel_args: '--config=ci-test --config=ci-linux'
    secrets: inherit
