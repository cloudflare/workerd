name: Bonk

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  bonk:
    if: github.event.sender.type != 'Bot' && (contains(github.event.comment.body, '/bonk') || contains(github.event.comment.body, '@ask-bonk') || contains(github.event.review.body, '/bonk') || contains(github.event.review.body, '@ask-bonk'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history so the PR diff has a merge base with main

      - name: Run Bonk
        uses: Cloudflare-Studio/ask-bonk/github@main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # opencode's default for paths not listed under external_directory is "ask", which
          # nobody can answer in CI, so the run blocks until the job timeout. Deny by default;
          # rules are matched last-wins, so "*" must come first.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"*":"deny","/home/runner/work/**":"allow","/home/runner/.cache/bazel/**":"allow"},"question":"deny","doom_loop":"deny"}}'
        with:
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: 'cloudflare-ai-gateway/openai/gpt-5.6-terra'
          mentions: '/bonk,@ask-bonk'
          variant: 'high'
          permissions: write
          opencode_dev: true
          # Specialists (up to 15m) run before the main review (up to 25m), inside the
          # 45-minute job timeout, so ask-bonk can always finalize the run itself.
          specialist_timeout: '15m'
          timeout: '25m'
          ignore_paths: |
            types/generated-snapshot/
          # Give re-reviews Bonk's previous review, its threads, and the changes since then.
          rereview_context: 'true'
          # token_permissions defaults to WRITE (i.e. Bonk can push commits).
          # We intentionally leave it that way here because users may ask Bonk
          # to update their PR via /bonk.
