name: New PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 30 # Fetch some history; not all of it

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<EOF'
            echo "You are reviewing PR #${{ github.event.pull_request.number }} on ${{ github.repository }}."
            echo ""
            cat .github/bonk_reviewer.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run Bonk
        uses: danlapid/ask-bonk/github@5a93168ff25d374f5d4191c7be4e9859991c48e7
        # Fork of ask-bonk with the timeout input and rereview_context, pending upstream review.
        # Switch back to ask-bonk/ask-bonk once those changes land there.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # opencode's default for paths not listed under external_directory is "ask", which
          # nobody can answer in CI, so the run blocks until the job timeout. Deny by default;
          # rules are matched last-wins, so "*" must come first.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"*":"deny","/home/runner/work/**":"allow","/home/runner/.cache/bazel/**":"allow"},"edit":"deny","question":"deny","doom_loop":"deny"}}'
        with:
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: 'cloudflare-ai-gateway/openai/gpt-5.6-terra'
          variant: 'high'
          forks: 'false'
          permissions: write
          opencode_dev: true
          # Stop opencode before the 30-minute job timeout so ask-bonk can finalize the run.
          timeout: '25m'
          # Give re-reviews Bonk's previous review, its threads, and the changes since then.
          rereview_context: 'true'
          # The auto-reviewer must never push to PR branches. Its prompt
          # (bonk_reviewer.md) already forbids git write ops, but NO_PUSH
          # enforces that at the token level so it holds even if the model
          # ignores the instruction.
          token_permissions: 'NO_PUSH'
          prompt: ${{ steps.prompt.outputs.value }}
