name: Check the PGO build

# The Linux release builds download the profile that build/pgo/profile.json names, so they would
# fail if its release asset went away. The profile job downloads it and checks its hash every day
# and whenever profile.json changes, so that a missing profile shows up before a release build
# needs it.
#
# Pull requests don't otherwise build the release configuration, so a change to the profile or to
# what the PGO build depends on, such as an LLVM or Rust update (ThinLTO links rustc's bitcode with
# lld, which must share its LLVM major version), also builds it, as release.yml does.
on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - .bazelrc
      - .github/workflows/pgo-check.yml
      - build/deps/llvm.MODULE.bazel
      - build/deps/rust.MODULE.bazel
      - build/pgo/**
      - patches/rules_rust/**
      - patches/toolchains_llvm/**
  push:
    branches:
      - main
    paths:
      - build/pgo/profile.json
  workflow_dispatch:

permissions:
  contents: read
  # Read/write artifacts, which _bazel.yml asks for
  actions: write
  # Authenticate to bazelflare
  id-token: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Download and check the profile
        run: |
          url=$(jq -r .url build/pgo/profile.json)
          integrity=$(jq -r .integrity build/pgo/profile.json)
          curl --fail --location --silent --show-error --output /tmp/workerd.profdata.zst "$url"
          actual="sha256-$(openssl dgst -sha256 -binary /tmp/workerd.profdata.zst | openssl base64 -A)"
          if [[ "$actual" != "$integrity" ]]; then
            echo "::error::$url has hash $actual, but build/pgo/profile.json expects $integrity"
            exit 1
          fi
          zstd -t /tmp/workerd.profdata.zst

  release-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          # As in release.yml.
          - title: linux
            image: ubuntu-24.04-16core
            arch: X64
            bazelflare: true
          - title: linux-arm64
            image: ubuntu-24.04-arm-16core
            arch: ARM64
      fail-fast: false
    name: release build (${{ matrix.title }})
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ${{ matrix.image }}
      os_name: Linux
      arch_name: ${{ matrix.arch }}
      phase: '-release'
      developer_flags: ${{ matrix.bazelflare && '--config=bazelflare-release' || '' }}
      extra_bazel_args: ${{ matrix.bazelflare && '--config=ci-release --config=ci-bazelflare' || '--strip=always --config=release_linux --config=ci-release' }}
      bazelflare: ${{ matrix.bazelflare || false }}
      runner_extra_bazel_args: '--strip=always --config=release_linux --config=ci-release'
      build_target: //src/workerd/server:workerd
      test_target: //build/pgo:pgo-config-test //src/workerd/server/tests/pgo-workload/...
    secrets:
      BAZEL_CACHE_KEY: ${{ secrets.BAZEL_CACHE_KEY }}
      WORKERS_MIRROR_URL: ${{ secrets.WORKERS_MIRROR_URL }}
      GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
