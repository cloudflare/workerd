name: WPT report

on:
  # Allow manual triggering for testing
  workflow_dispatch:

permissions:
  # Read repo
  contents: read

  # Read/write artifacts
  actions: write

jobs:
  test:
    uses: ./.github/workflows/_bazel.yml
    with:
      os_name: linux
      suffix: ''
      # wpt-report downloads the WPT test logs, which ci-test's --remote_download_minimal does not.
      extra_bazel_args: '--config=ci-test --config=wpt-report'
      test_target: '//src/wpt/...'
      upload_test_logs: true
      fetch_depth: 0
    secrets:
      BAZEL_CACHE_KEY: ${{ secrets.BAZEL_CACHE_KEY }}
      WORKERS_MIRROR_URL: ${{ secrets.WORKERS_MIRROR_URL }}
      GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}

  report:
    needs: [test]
    uses: ./.github/workflows/_wpt.yml
    with:
        image: ubuntu-22.04
        logs_artifact: 'test-logs-linux-X64.zip'
        report_artifact: 'wpt-report.json'





