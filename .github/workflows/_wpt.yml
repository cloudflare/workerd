name: 'WPT Report'
on:
  workflow_call:
    inputs:
      image:
        description: 'Runner image to use'
        required: true
        type: string
      logs_artifact:
        description: 'Name of artifact containing test logs'
        required: true
        type: string

permissions:
  # Read repo
  contents: read
  # Read artifacts
  actions: read
jobs:
  wpt-report:
    runs-on: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Download test logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.logs_artifact }}
          path: testlogs
      - name: Generate WPT stats
        run: ./tools/cross/wpt_logs.py --print-stats testlogs/ >> $GITHUB_STEP_SUMMARY
