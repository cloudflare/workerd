name: Coverage

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: coverage.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # Read repo
  contents: read
  # Read/write artifacts
  actions: write
  # Authenticate to bazelflare
  id-token: write

jobs:
  coverage-linux:
    uses: ./.github/workflows/_bazel.yml
    with:
      image: ubuntu-22.04-16core
      os_name: linux
      arch_name: 'X64'
      suffix: 'coverage'
      bazelflare: true
      developer_flags: '--config=bazelflare-coverage'
      extra_bazel_args: '--config=ci-bazelflare-coverage'
      runner_developer_flags: '--config=coverage'
      runner_extra_bazel_args: '--config=ci-linux-common'
      upload_test_logs: true
      upload_binary: false
      build_container_images: false
      run_coverage: true
      run_tests: false
      test_target: "//src/workerd/..."
    secrets:
      BAZEL_CACHE_KEY: ${{ secrets.BAZEL_CACHE_KEY }}
      WORKERS_MIRROR_URL: ${{ secrets.WORKERS_MIRROR_URL }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
