name: Dependency updater

on:
  schedule:
    # Run at 18:30 UTC every Monday
    - cron: '30 18 * * 1'
  # Allow manual triggering for testing
  workflow_dispatch:

concurrency:
  group: deps-updater
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          token: ${{ secrets.DEVPROD_PAT }}
          ref: main
      - name: Setup Runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
      - name: Update dependencies
        run: build/deps/update-deps.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update rust dependencies
        run: bazel fetch --repo_env=CARGO_BAZEL_REPIN=all --repo=@crates_vendor
      - name: Update the base of the container image
        # A failed lookup skips this update; a Dockerfile that no longer matches fails the job.
        run: |
          pattern='^FROM gcr\.io/distroless/cc-debian13:nonroot@sha256:[0-9a-f]{64} '
          if ! grep -qE "$pattern" docker/Dockerfile; then
            echo "::error::docker/Dockerfile has no FROM line matching $pattern"
            exit 1
          fi
          if ! digest=$(docker buildx imagetools inspect gcr.io/distroless/cc-debian13:nonroot \
            --format '{{.Manifest.Digest}}') || ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::Could not look up the base image's digest; not updating it."
            exit 0
          fi
          sed -i -E "s|^(FROM gcr\.io/distroless/cc-debian13:nonroot@)sha256:[0-9a-f]{64} |\1$digest |" \
            docker/Dockerfile
          grep -qF "FROM gcr.io/distroless/cc-debian13:nonroot@$digest " docker/Dockerfile
      - name: Reformat changed files
        run: ./tools/cross/format.py git
      - name: Open pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "update dependencies to latest version"
          branch: "automatic-update-deps"
          title: "Update dependencies"
          token: ${{ secrets.DEVPROD_PAT }}
          author: "Workers DevProd <workers-devprod@cloudflare.com>"
          committer: "Workers DevProd <workers-devprod@cloudflare.com>"
          body: |
            This is an automated pull request for updating the dependencies of workerd.
          delete-branch: true
          add-paths: |
            MODULE.bazel.lock
            build/deps/gen
            deps/rust
            docker/Dockerfile
            .github/workflows
      - name: Enable Pull Request Automerge
        run: gh pr merge --rebase --auto ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.DEVPROD_PAT }}
